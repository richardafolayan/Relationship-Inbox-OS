<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn streaming div scroll fixture</title>
    <style>
      body {
        margin: 14px;
        font-family: Arial, sans-serif;
      }

      .pill-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      .layout {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 14px;
      }

      #left-shell {
        border: 1px solid #d1d5db;
        padding: 8px;
      }

      #thread-scroll {
        height: 250px;
        overflow-y: auto;
        border: 1px solid #cbd5e1;
      }

      #list-root[role="listbox"] {
        display: flex;
        flex-direction: column;
      }

      .msg-conversation-listitem {
        border-bottom: 1px solid #e2e8f0;
      }

      .msg-conversation-listitem__link {
        display: block;
        min-height: 90px;
        padding: 8px;
      }

      .msg-conversation-listitem__link--active {
        background: #dbeafe;
      }

      .msg-conversation-card__message-snippet {
        margin: 4px 0;
      }

      .msg-conversation-card__unread-count {
        display: inline-block;
        background: #2563eb;
        color: #fff;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 12px;
      }

      .msg-s-message-list {
        min-height: 200px;
        border: 1px solid #d1d5db;
        padding: 8px;
      }

      .msg-s-event-listitem {
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="pill-row">
      <button type="button" data-test-messaging-inbox-filters__filter-pill="UNREAD" aria-pressed="false">Unread</button>
      <button type="button" data-test-messaging-inbox-filters__filter-pill="ALL" aria-pressed="true">All</button>
    </div>

    <main class="scaffold-layout__main">
      <div class="layout">
        <section id="left-shell" class="msg-conversations-container" data-test="conversations-shell">
          <div id="thread-scroll" class="scaffold-finite-scroll__content">
            <div id="list-root" role="listbox" aria-label="Conversations"></div>
          </div>
        </section>
        <section>
          <h3 id="active-title">No thread selected</h3>
          <div id="message-container" class="msg-s-message-list" hidden></div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const rows = [
          { id: "alpha", name: "Alpha One", snippet: "Alpha One: hello", unread: 0, time: "6:11 AM" },
          { id: "bravo", name: "Bravo Two", snippet: "You: done", unread: 1, time: "6:14 AM" },
          { id: "sponsor", name: "Sponsored Row", snippet: "Limited offer", unread: 4, time: "6:15 AM", sponsored: true },
          { id: "charlie", name: "Charlie Three", snippet: "Charlie Three: following up", unread: 0, time: "6:18 AM" },
          { id: "delta", name: "Delta Four", snippet: "You: got it", unread: 0, time: "6:20 AM" },
          { id: "echo", name: "Echo Five", snippet: "Echo Five: checking in", unread: 0, time: "6:23 AM" },
          { id: "foxtrot", name: "Foxtrot Six", snippet: "You: sent", unread: 0, time: "6:24 AM" },
          { id: "golf", name: "Golf Seven", snippet: "Golf Seven: ping", unread: 0, time: "6:28 AM" },
          { id: "hotel", name: "Hotel Eight", snippet: "You: thanks", unread: 2, time: "6:30 AM" },
          { id: "india", name: "India Nine", snippet: "India Nine: reminder", unread: 0, time: "6:34 AM" }
        ];

        const messageByThread = Object.fromEntries(
          rows.map((row, index) => [
            row.id,
            [{ direction: row.snippet.startsWith("You:") ? "OUT" : "IN", text: row.snippet, timestamp: `2026-02-18T09:${String(20 + index).padStart(2, "0")}:00.000Z` }]
          ])
        );

        const listRoot = document.getElementById("list-root");
        const messageContainer = document.getElementById("message-container");
        const activeTitle = document.getElementById("active-title");
        let activeId = null;

        function openThread(id) {
          activeId = id;
          const row = rows.find((entry) => entry.id === id);
          if (activeTitle) {
            activeTitle.textContent = row ? row.name : id;
          }
          if (messageContainer) {
            messageContainer.innerHTML = "";
            const messages = messageByThread[id] || [];
            for (const [idx, message] of messages.entries()) {
              const node = document.createElement("div");
              node.className = `msg-s-event-listitem ${message.direction === "IN" ? "msg-s-event-listitem--other" : "msg-s-event-listitem--self"}`;
              node.setAttribute("data-event-urn", `${id}-${idx}`);
              node.innerHTML = `<p class="msg-s-event-listitem__body">${message.text}</p><time datetime="${message.timestamp}">${message.timestamp}</time>`;
              messageContainer.appendChild(node);
            }
            messageContainer.hidden = false;
          }
          try {
            history.replaceState({}, "", `/messaging/thread/${id}/`);
          } catch {
            window.location.hash = `#/messaging/thread/${id}/`;
          }
          renderRows();
        }

        function renderRows() {
          if (!listRoot) {
            return;
          }
          listRoot.innerHTML = "";
          for (const row of rows) {
            const item = document.createElement("div");
            item.className = "msg-conversation-listitem";
            item.id = `ember-${row.id}`;
            item.setAttribute("data-conversation-urn", `urn:li:msg_thread:${row.id}`);
            item.setAttribute("data-urn", `urn:li:msg_thread:${row.id}`);
            item.setAttribute("data-control-id", `control-${row.id}`);
            item.setAttribute("role", "option");

            const activeClass =
              row.id === activeId
                ? "msg-conversation-listitem__link--active msg-conversations-container__convo-item-link--active"
                : "";

            item.innerHTML = `
              <div class="msg-conversation-listitem__link msg-conversations-container__convo-item-link ${activeClass}">
                <a class="msg-conversation-card__conversation-link" href="https://www.linkedin.com/messaging/thread/${row.id}/">open</a>
                <h3 class="msg-conversation-listitem__participant-names"><span class="truncate">${row.name}</span></h3>
                <p class="msg-conversation-card__message-snippet">${row.snippet}</p>
                ${row.sponsored ? '<span class="msg-conversation-card__pill">Sponsored</span>' : ""}
                <time class="msg-conversation-listitem__time-stamp">${row.time}</time>
                ${row.unread > 0 ? `<div class="msg-conversation-card__unread-count"><span class="notification-badge__count">${row.unread}</span></div>` : ""}
              </div>
            `;

            const clickable = item.querySelector(".msg-conversation-listitem__link");
            if (clickable) {
              clickable.addEventListener("click", (event) => {
                event.preventDefault();
                openThread(row.id);
              });
            }
            listRoot.appendChild(item);
          }
        }

        renderRows();
      })();
    </script>
  </body>
</html>
