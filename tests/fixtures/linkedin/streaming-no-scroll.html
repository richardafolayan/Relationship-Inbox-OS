<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn streaming no scroll fixture</title>
    <style>
      body {
        margin: 12px;
        font-family: Arial, sans-serif;
      }

      .layout {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 12px;
      }

      .msg-conversations-container {
        border: 1px solid #cbd5e1;
        padding: 8px;
      }

      .msg-conversations-container__conversations-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .msg-conversation-listitem {
        border-bottom: 1px solid #e2e8f0;
      }

      .msg-conversation-listitem__link {
        display: block;
        min-height: 74px;
        padding: 8px;
      }

      .msg-s-message-list {
        min-height: 180px;
        border: 1px solid #d1d5db;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button type="button" data-test-messaging-inbox-filters__filter-pill="UNREAD" aria-pressed="false">Unread</button>
      <button type="button" data-test-messaging-inbox-filters__filter-pill="ALL" aria-pressed="true">All</button>
    </div>

    <main class="scaffold-layout__main">
      <div class="layout">
        <section class="msg-conversations-container">
          <ul class="msg-conversations-container__conversations-list" role="list">
            <li class="msg-conversation-listitem" id="ember-one" data-conversation-urn="urn:li:msg_thread:one">
              <div class="msg-conversation-listitem__link">
                <a href="https://www.linkedin.com/messaging/thread/one/">open</a>
                <h3 class="msg-conversation-listitem__participant-names"><span class="truncate">No Scroll One</span></h3>
                <p class="msg-conversation-card__message-snippet">No Scroll One: ping</p>
                <time class="msg-conversation-listitem__time-stamp">6:10 AM</time>
              </div>
            </li>
            <li class="msg-conversation-listitem" id="ember-two" data-conversation-urn="urn:li:msg_thread:two">
              <div class="msg-conversation-listitem__link">
                <a href="https://www.linkedin.com/messaging/thread/two/">open</a>
                <h3 class="msg-conversation-listitem__participant-names"><span class="truncate">No Scroll Two</span></h3>
                <p class="msg-conversation-card__message-snippet">You: done</p>
                <time class="msg-conversation-listitem__time-stamp">6:12 AM</time>
              </div>
            </li>
            <li class="msg-conversation-listitem" id="ember-three" data-conversation-urn="urn:li:msg_thread:three">
              <div class="msg-conversation-listitem__link">
                <a href="https://www.linkedin.com/messaging/thread/three/">open</a>
                <h3 class="msg-conversation-listitem__participant-names"><span class="truncate">No Scroll Three</span></h3>
                <p class="msg-conversation-card__message-snippet">No Scroll Three: follow up</p>
                <time class="msg-conversation-listitem__time-stamp">6:14 AM</time>
              </div>
            </li>
          </ul>
        </section>
        <section>
          <h3 id="active-title">No thread selected</h3>
          <div id="message-container" class="msg-s-message-list" hidden></div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const messageContainer = document.getElementById("message-container");
        const activeTitle = document.getElementById("active-title");

        function openThread(id, name, snippet) {
          if (activeTitle) {
            activeTitle.textContent = name;
          }
          if (messageContainer) {
            messageContainer.hidden = false;
            messageContainer.innerHTML = `<div class="msg-s-event-listitem msg-s-event-listitem--other" data-event-urn="${id}-1"><p class="msg-s-event-listitem__body">${snippet}</p><time datetime="2026-02-18T09:20:00.000Z">2026-02-18T09:20:00.000Z</time></div>`;
          }
          try {
            history.replaceState({}, "", `/messaging/thread/${id}/`);
          } catch {
            window.location.hash = `#/messaging/thread/${id}/`;
          }
        }

        for (const row of Array.from(document.querySelectorAll(".msg-conversation-listitem"))) {
          const clickable = row.querySelector(".msg-conversation-listitem__link");
          if (!clickable) {
            continue;
          }
          clickable.addEventListener("click", (event) => {
            event.preventDefault();
            const id = row.id.replace("ember-", "") || "unknown";
            const name = row.querySelector(".msg-conversation-listitem__participant-names")?.textContent?.trim() || id;
            const snippet = row.querySelector(".msg-conversation-card__message-snippet")?.textContent?.trim() || "";
            openThread(id, name, snippet);
          });
        }
      })();
    </script>
  </body>
</html>
