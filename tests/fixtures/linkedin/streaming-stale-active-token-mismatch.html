<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn streaming stale active token mismatch fixture</title>
    <script>
      window.location.hash = "#/messaging/thread/live-two/";
    </script>
    <style>
      body { margin: 12px; font-family: Arial, sans-serif; }
      .layout { display: grid; grid-template-columns: 420px 1fr; gap: 12px; }
      .msg-conversations-container { border: 1px solid #cbd5e1; padding: 8px; }
      .msg-conversations-container__conversations-list { list-style: none; margin: 0; padding: 0; }
      .msg-conversation-listitem { border-bottom: 1px solid #e2e8f0; }
      .msg-conversation-listitem__link { display: block; min-height: 72px; padding: 8px; }
      .msg-s-message-list { min-height: 180px; border: 1px solid #d1d5db; padding: 8px; }
    </style>
  </head>
  <body>
    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button type="button" data-test-messaging-inbox-filters__filter-pill="UNREAD" aria-pressed="false">Unread</button>
      <button type="button" data-test-messaging-inbox-filters__filter-pill="ALL" aria-pressed="true">All</button>
    </div>

    <main class="scaffold-layout__main">
      <div class="layout">
        <section class="msg-conversations-container msg__messaging-container">
          <ul class="msg-conversations-container__conversations-list" role="list">
            <li class="msg-conversation-listitem" id="ember-stale-one" data-conversation-urn="urn:li:msg_thread:stale-one">
              <div class="msg-conversation-listitem__link msg-conversation-listitem__link--active msg-conversations-container__convo-item-link--active" tabindex="0" aria-current="true">
                <a href="https://www.linkedin.com/messaging/thread/stale-one/">open</a>
                <h3 class="msg-conversation-listitem__participant-names"><span class="truncate">Stale Active</span></h3>
                <p class="msg-conversation-card__message-snippet">Stale Active: need your reply</p>
                <time class="msg-conversation-listitem__time-stamp">6:18 AM</time>
              </div>
            </li>
            <li class="msg-conversation-listitem" id="ember-live-two" data-conversation-urn="urn:li:msg_thread:live-two">
              <div class="msg-conversation-listitem__link" tabindex="0">
                <a href="https://www.linkedin.com/messaging/thread/live-two/">open</a>
                <h3 class="msg-conversation-listitem__participant-names"><span class="truncate">Actually Active</span></h3>
                <p class="msg-conversation-card__message-snippet">You: done</p>
                <time class="msg-conversation-listitem__time-stamp">6:22 AM</time>
              </div>
            </li>
          </ul>
        </section>
        <section>
          <h3 id="active-title">Actually Active</h3>
          <div id="message-container" class="msg-s-message-list">
            <div class="msg-s-event-listitem msg-s-event-listitem--other" data-event-urn="live-two-msg-1">
              <div class="msg-s-event-listitem__message-bubble">
                <p class="msg-s-event-listitem__body">live thread existing message</p>
              </div>
              <time datetime="2026-02-18T09:22:00.000Z">2026-02-18T09:22:00.000Z</time>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        window.__staleActiveFixtureMetrics = { staleRowClickCount: 0 };
        const staleRow = document.getElementById("ember-stale-one");
        const staleLink = staleRow?.querySelector(".msg-conversation-listitem__link");
        const liveRow = document.getElementById("ember-live-two");
        const liveLink = liveRow?.querySelector(".msg-conversation-listitem__link");
        const messageContainer = document.getElementById("message-container");
        const activeTitle = document.getElementById("active-title");

        function markActive(rowId) {
          for (const node of document.querySelectorAll(".msg-conversation-listitem__link")) {
            node.classList.remove("msg-conversation-listitem__link--active");
            node.classList.remove("msg-conversations-container__convo-item-link--active");
            node.removeAttribute("aria-current");
          }
          const target = document.querySelector(`#${rowId} .msg-conversation-listitem__link`);
          if (target) {
            target.classList.add("msg-conversation-listitem__link--active");
            target.classList.add("msg-conversations-container__convo-item-link--active");
            target.setAttribute("aria-current", "true");
          }
        }

        if (staleLink) {
          staleLink.addEventListener("click", (event) => {
            event.preventDefault();
            window.__staleActiveFixtureMetrics.staleRowClickCount += 1;
            markActive("ember-stale-one");
            if (activeTitle) {
              activeTitle.textContent = "Stale Active";
            }
            if (messageContainer) {
              messageContainer.innerHTML = `
                <div class="msg-s-event-listitem msg-s-event-listitem--other" data-event-urn="stale-one-msg-1">
                  <div class="msg-s-event-listitem__message-bubble">
                    <p class="msg-s-event-listitem__body">stale thread now opened</p>
                  </div>
                  <time datetime="2026-02-18T09:24:00.000Z">2026-02-18T09:24:00.000Z</time>
                </div>
              `;
            }
            try {
              history.replaceState({}, "", "/messaging/thread/stale-one/");
            } catch {
              window.location.hash = "#/messaging/thread/stale-one/";
            }
          });
        }

        if (liveLink) {
          liveLink.addEventListener("click", (event) => {
            event.preventDefault();
            markActive("ember-live-two");
          });
        }
      })();
    </script>
  </body>
</html>
