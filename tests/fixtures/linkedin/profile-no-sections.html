<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic LinkedIn profile (top card only) | LinkedIn</title>
    <style>
      body {
        margin: 16px;
        font-family: Arial, sans-serif;
      }
      section {
        border: 1px solid #d1d5db;
        padding: 8px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- A minimal public profile with only the top card and an About
           section: none of the five structured sections exist. Every
           array must be empty and every presence flag false. -->
      <section>
        <div><span aria-hidden="true">Casey Minimal</span></div>
        <div><span aria-hidden="true">Independent Consultant</span></div>
        <div><span aria-hidden="true">Contact info</span></div>
      </section>
      <section>
        <h2><span aria-hidden="true">About</span></h2>
        <div><span aria-hidden="true">Short bio with no structured sections attached.</span></div>
      </section>
    </main>
  </body>
</html>
