name: One-off enforce student main gate

on:
  push:
    branches: ["fix/release-guide-main-promotion"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-guide-main-promotion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add executable student release guard
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path_name}, found {count}: {old!r}")
              path.write_text(text.replace(old, new))

          replace_once(
              "scripts/build-student-release.mjs",
              '//   --ref <git-ref>     git ref to archive (default: HEAD)\n',
              '//   --ref <git-ref>     git ref to archive (default: HEAD). Student builds must\n'
              '//                       resolve to a commit already promoted to main.\n'
          )

          replace_once(
              "scripts/build-student-release.mjs",
              'function git(...a) {\n'
              '  return execFileSync("git", a, { cwd: ROOT, encoding: "utf8" }).trim();\n'
              '}\n',
              'function git(...a) {\n'
              '  return execFileSync("git", a, { cwd: ROOT, encoding: "utf8" }).trim();\n'
              '}\n'
              '\n'
              'function resolveStudentMainRef() {\n'
              '  const override = process.env.RIOS_STUDENT_RELEASE_MAIN_REF?.trim();\n'
              '  const candidates = override ? [override] : ["origin/main", "main"];\n'
              '  for (const candidate of candidates) {\n'
              '    try {\n'
              '      return { ref: candidate, commit: git("rev-parse", "--verify", `${candidate}^{commit}`) };\n'
              '    } catch {\n'
              '      // Try the next trusted main ref.\n'
              '    }\n'
              '  }\n'
              '  die(\n'
              '    "Cannot verify the student release against main. Run git fetch origin main, " +\n'
              '    "or set RIOS_STUDENT_RELEASE_MAIN_REF to the trusted main ref for this repository."\n'
              '  );\n'
              '}\n'
              '\n'
              'function assertStudentRefPromoted(ref) {\n'
              '  if (CHANNEL !== "student") return;\n'
              '  let candidate;\n'
              '  try {\n'
              '    candidate = git("rev-parse", "--verify", `${ref}^{commit}`);\n'
              '  } catch {\n'
              '    die(`Cannot resolve student release ref ${ref}.`);\n'
              '  }\n'
              '  const main = resolveStudentMainRef();\n'
              '  try {\n'
              '    execFileSync("git", ["merge-base", "--is-ancestor", candidate, main.commit], {\n'
              '      cwd: ROOT,\n'
              '      stdio: "ignore"\n'
              '    });\n'
              '  } catch {\n'
              '    die(\n'
              '      `Refusing to build a student release from ${ref} (${candidate.slice(0, 7)}): ` +\n'
              '      `the commit is not contained in ${main.ref}. Promote develop to main first. ` +\n'
              '      "Use --channel dev for unpromoted development commits."\n'
              '    );\n'
              '  }\n'
              '}\n'
          )

          replace_once(
              "scripts/build-student-release.mjs",
              '  let commit = "";\n'
              '  let releaseNotes;\n',
              '  let commit = "";\n'
              '  let fullCommit = "";\n'
              '  let releaseNotes;\n'
          )

          replace_once(
              "scripts/build-student-release.mjs",
              '    if (baked.commit) commit = String(baked.commit).slice(0, 7);\n',
              '    if (baked.commit) {\n'
              '      fullCommit = String(baked.commit);\n'
              '      commit = fullCommit.slice(0, 7);\n'
              '    }\n'
          )

          replace_once(
              "scripts/build-student-release.mjs",
              '  } catch {\n'
              '    try { commit = git("rev-parse", "--short", REF); } catch { /* not a git checkout */ }\n'
              '  }\n'
              '  const { manifestPath, zipUrl } = writeManifest({ version, build, commit, zipPath, sha256, releaseNotes });\n',
              '  } catch {\n'
              '    try {\n'
              '      fullCommit = git("rev-parse", REF);\n'
              '      commit = fullCommit.slice(0, 7);\n'
              '    } catch { /* not a git checkout */ }\n'
              '  }\n'
              '  assertStudentRefPromoted(fullCommit || REF);\n'
              '  const { manifestPath, zipUrl } = writeManifest({ version, build, commit, zipPath, sha256, releaseNotes });\n'
          )

          replace_once(
              "scripts/build-student-release.mjs",
              'async function build() {\n'
              '  const version = releaseVersionFromRef(REF);\n',
              'async function build() {\n'
              '  assertStudentRefPromoted(REF);\n'
              '  const version = releaseVersionFromRef(REF);\n'
          )

          replace_once(
              "docs/pilot/releasing-student-builds.md",
              'From a clean checkout of the exact release commit promoted to `main`:\n\n'
              '```bash\n'
              'npm run build:student-release\n'
              '```\n',
              'From a clean checkout of the exact release commit promoted to `main`:\n\n'
              '```bash\n'
              'git fetch origin main\n'
              'npm run build:student-release\n'
              '```\n\n'
              'The builder verifies that the archived commit is contained in `origin/main`\n'
              '(or local `main` when no remote main ref exists). It refuses student builds\n'
              'from unpromoted commits. Use the `dev` channel for development refs.\n'
          )

          replace_once(
              ".github/workflows/publish-student-release.yml",
              '# branch): reaching main IS the "ship to pilots" gate. develop/staging/v1 and\n'
              '# feature branches never publish. You can also run it manually\n',
              '# branch): reaching main IS the "ship to pilots" gate. develop, staging, and\n'
              '# feature branches never publish. You can also run it manually\n'
          )

          replace_once(
              "tests/student-publish-release.test.mjs",
              'process.env.RIOS_RELEASE_ENV_FILE = "/nonexistent/.env.release.local";\n',
              'process.env.RIOS_RELEASE_ENV_FILE = "/nonexistent/.env.release.local";\n'
              'process.env.RIOS_STUDENT_RELEASE_MAIN_REF = "HEAD";\n'
          )

          replace_once(
              "tests/student-build-release.test.mjs",
              'import { execFileSync } from "node:child_process";\n',
              'import { execFileSync, spawnSync } from "node:child_process";\n'
          )

          replace_once(
              "tests/student-build-release.test.mjs",
              '        ...process.env,\n'
              '        RIOS_RELEASE_ENV_FILE: "/nonexistent/.env.release.local"\n'
              '      }\n'
              '    });\n\n'
              '    const versionedZip = join(out, "relationship-inbox-os-student-9.8.7.zip");\n',
              '        ...process.env,\n'
              '        RIOS_RELEASE_ENV_FILE: "/nonexistent/.env.release.local",\n'
              '        RIOS_STUDENT_RELEASE_MAIN_REF: ref\n'
              '      }\n'
              '    });\n\n'
              '    const versionedZip = join(out, "relationship-inbox-os-student-9.8.7.zip");\n'
          )

          replace_once(
              "tests/student-build-release.test.mjs",
              '        ...process.env,\n'
              '        RIOS_RELEASE_ENV_FILE: "/nonexistent/.env.release.local"\n'
              '      }\n'
              '    });\n\n'
              '    const manifest = JSON.parse(readFileSync(join(out, "latest.json"), "utf8"));\n',
              '        ...process.env,\n'
              '        RIOS_RELEASE_ENV_FILE: "/nonexistent/.env.release.local",\n'
              '        RIOS_STUDENT_RELEASE_MAIN_REF: ref\n'
              '      }\n'
              '    });\n\n'
              '    const manifest = JSON.parse(readFileSync(join(out, "latest.json"), "utf8"));\n'
          )

          test_append = '''\n\ntest("build-student-release rejects a student ref that is not promoted to main", () => {\n  const work = mkdtempSync(join(tmpdir(), "rios-build-release-main-gate-"));\n  const out = join(work, "release-dist");\n  try {\n    const ref = commitPackageVersion("9.8.7", work);\n    const result = spawnSync(process.execPath, [BUILD, "--ref", ref, "--out", out], {\n      cwd: ROOT,\n      encoding: "utf8",\n      env: {\n        ...process.env,\n        RIOS_RELEASE_ENV_FILE: "/nonexistent/.env.release.local",\n        RIOS_STUDENT_RELEASE_MAIN_REF: "HEAD"\n      }\n    });\n    assert.notEqual(result.status, 0);\n    assert.match(result.stderr, /not contained in HEAD/);\n    assert.match(result.stderr, /Promote develop to main first/);\n  } finally {\n    rmSync(work, { recursive: true, force: true });\n  }\n});\n\ntest("build-student-release allows an unpromoted ref on the dev channel", () => {\n  const work = mkdtempSync(join(tmpdir(), "rios-build-release-dev-gate-"));\n  const out = join(work, "release-dist");\n  try {\n    const ref = commitPackageVersion("9.8.7", work);\n    const result = spawnSync(process.execPath, [\n      BUILD, "--channel", "dev", "--ref", ref, "--out", out,\n      "--update-feed-url", "https://github.com/o/r/releases/download/dev/latest.json"\n    ], {\n      cwd: ROOT,\n      encoding: "utf8",\n      env: {\n        ...process.env,\n        RIOS_RELEASE_ENV_FILE: "/nonexistent/.env.release.local",\n        RIOS_STUDENT_RELEASE_MAIN_REF: "HEAD"\n      }\n    });\n    assert.equal(result.status, 0, result.stderr);\n    assert.ok(existsSync(join(out, "relationship-inbox-os-dev-latest.zip")));\n  } finally {\n    rmSync(work, { recursive: true, force: true });\n  }\n});\n'''
          path = Path("tests/student-build-release.test.mjs")
          text = path.read_text()
          if 'rejects a student ref that is not promoted to main' in text:
              raise SystemExit("Guard tests already present")
          path.write_text(text + test_append)
          PY

      - name: Run focused release tests
        run: |
          node --test tests/student-build-release.test.mjs tests/student-publish-release.test.mjs tests/dev-update-channel.test.mjs

      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-student-release.mjs \
            docs/pilot/releasing-student-builds.md \
            .github/workflows/publish-student-release.yml \
            tests/student-build-release.test.mjs \
            tests/student-publish-release.test.mjs
          git diff --cached --check
          git commit -m "fix: enforce main gate for student release builds"
          git push origin HEAD:fix/release-guide-main-promotion
