name: One-off retire active v1 references

on:
  push:
    branches: ["chore/retire-v1-active-references"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/retire-v1-active-references
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replace active branch references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/runner/src/config.ts": [
                  (
                      '      // Where to commit the screenshot file. Defaults to the v1\n'
                      '      // integration branch; operators can pin a different branch\n'
                      '      // (e.g. "main" once v1 lands) without touching code.\n'
                      '      attachmentsBranch: env.GITHUB_ATTACHMENTS_BRANCH?.trim() || "v1/strip-back-pr1"',
                      '      // Where to commit the screenshot file. Defaults to the develop\n'
                      '      // integration branch; operators can pin a different branch without\n'
                      '      // touching code.\n'
                      '      attachmentsBranch: env.GITHUB_ATTACHMENTS_BRANCH?.trim() || "develop"'
                  )
              ],
              "apps/runner/src/services/github-attachments.ts": [
                  ('Default: "v1/strip-back-pr1".', 'Default: "develop".'),
                  ('const branch = opts.branch ?? "v1/strip-back-pr1";', 'const branch = opts.branch ?? "develop";')
              ],
              "tests/runner-github-attachments.test.mjs": [
                  ('assert.equal(body.branch, "v1/strip-back-pr1");', 'assert.equal(body.branch, "develop");')
              ],
              ".env.example": [
                  ('#                               Defaults to v1/strip-back-pr1.', '#                               Defaults to develop.')
              ],
              "docs/developer/configuration.md": [
                  ('| `GITHUB_ATTACHMENTS_BRANCH` | `v1/strip-back-pr1` | Attachment commit branch. |', '| `GITHUB_ATTACHMENTS_BRANCH` | `develop` | Attachment commit branch. |')
              ],
              "docs/pilot/releasing-student-builds.md": [
                  ('1. You merge new code into `v1/strip-back-pr1`.', '1. You merge verified development work into `develop`.'),
                  ('From a clean checkout of the branch you are releasing (normally\n`v1/strip-back-pr1`):', 'From a clean checkout of the branch you are releasing (normally\n`develop`):')
              ],
              "docs/pilot/automated-release-publishing.md": [
                  ('`develop`, `staging`, `v1/strip-back-pr1`, and\nfeature branches **never** publish', '`develop`, `staging`, and feature branches **never** publish'),
                  ('Work flows freely through `develop`, `staging`,\n`v1/strip-back-pr1`, and feature branches without ever touching pilots;', 'Work flows freely through `develop`, `staging`, and feature branches without ever touching pilots;'),
                  ('Separate from the pilot channel above, every push to `v1/strip-back-pr1`\npublishes a **dev-channel** build', 'Separate from the pilot channel above, every push to `develop`\npublishes a **dev-channel** build')
              ],
              "docs/operations/releases.md": [
                  ('`develop`, `staging`, `v1/strip-back-pr1`, and feature branches do not\nautomatically publish to pilots.', '`develop`, `staging`, and feature branches do not automatically publish\nto pilots.')
              ],
              "scripts/build-macos-dmg.mjs": [
                  ('push to v1/strip-back-pr1 (issue #843).', 'push to develop (issue #843).')
              ],
              "scripts/build-student-release.mjs": [
                  ('// v1/strip-back-pr1):', '// develop):')
              ]
          }

          for file_name, file_replacements in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in file_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {file_name}, found {count}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify active references are retired
        run: |
          ! grep -RIn "v1/strip-back-pr1" \
            apps/runner/src/config.ts \
            apps/runner/src/services/github-attachments.ts \
            tests/runner-github-attachments.test.mjs \
            .env.example \
            docs/developer/configuration.md \
            docs/pilot/releasing-student-builds.md \
            docs/pilot/automated-release-publishing.md \
            docs/operations/releases.md \
            scripts/build-macos-dmg.mjs \
            scripts/build-student-release.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/runner/src/config.ts \
            apps/runner/src/services/github-attachments.ts \
            tests/runner-github-attachments.test.mjs \
            .env.example \
            docs/developer/configuration.md \
            docs/pilot/releasing-student-builds.md \
            docs/pilot/automated-release-publishing.md \
            docs/operations/releases.md \
            scripts/build-macos-dmg.mjs \
            scripts/build-student-release.mjs
          git diff --cached --check
          git commit -m "chore: retire active v1 branch references"
          git push origin HEAD:chore/retire-v1-active-references
