name: Publish Free Signed macOS Release

on:
  workflow_dispatch: {}
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

concurrency:
  group: publish-free-macos-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Resolve the branch release track
        run: |
          node scripts/resolve-macos-release-channel.mjs \
            --branch "$GITHUB_REF_NAME" \
            --github-env "$GITHUB_ENV"

      - name: Require the free signing secrets
        env:
          P12_BASE64: ${{ secrets.RIOS_FREE_MACOS_P12_BASE64 }}
          CERT_BASE64: ${{ secrets.RIOS_FREE_MACOS_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.RIOS_FREE_MACOS_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.RIOS_FREE_MACOS_IDENTITY }}
        run: |
          test -n "$P12_BASE64"
          test -n "$CERT_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$SIGNING_IDENTITY"

      - name: Import the private signing identity
        env:
          P12_BASE64: ${{ secrets.RIOS_FREE_MACOS_P12_BASE64 }}
          CERT_BASE64: ${{ secrets.RIOS_FREE_MACOS_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.RIOS_FREE_MACOS_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.RIOS_FREE_MACOS_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/tovi-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tovi-signing.p12"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/tovi-signing.cer"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Keep login keychain on the search path; only listing the build keychain
          # can break later steps and hide system identities.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security import "$RUNNER_TEMP/tovi-signing.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # User-keychain trustRoot prompts on macOS runners and can hang forever.
          # System keychain trust is non-interactive on GitHub-hosted runners.
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$RUNNER_TEMP/tovi-signing.cer"
          security find-identity -v -p codesigning | grep -F "$SIGNING_IDENTITY"

      - name: Install and verify
        run: |
          npm ci
          npx patchright install chromium
          npm run db:generate
          npm run lint
          npm run test:all

      - name: Build the signed app, DMG, update zip, and feed
        env:
          RIOS_CODESIGN_IDENTITY: ${{ secrets.RIOS_FREE_MACOS_IDENTITY }}
          RIOS_CODESIGN_CERTIFICATE: ${{ runner.temp }}/tovi-signing.cer
        run: |
          if [ -n "$RELEASE_VERSION_OVERRIDE" ]; then
            RELEASE_VERSION_OVERRIDE="$RELEASE_VERSION_OVERRIDE" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(readFileSync(path, "utf8"));
          pkg.version = process.env.RELEASE_VERSION_OVERRIDE;
          writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          fi

          UPDATE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          npm run build:macos-dmg -- \
            --channel "$BUILD_CHANNEL" \
            --update-feed-url "$UPDATE_BASE/$FEED_NAME" \
            --update-url "$UPDATE_BASE/$ZIP_NAME" \
            --note "Free signed macOS ${RELEASE_TRACK} build ${GITHUB_SHA}."

          node scripts/finalize-macos-release-feed.mjs \
            --path release-dist/macos/latest-macos.json \
            --track "$RELEASE_TRACK"

          test "$(uname -m)" = "arm64"
          codesign --verify --deep --strict --verbose=2 release-dist/macos/Tovi.app
          # -r- writes the designated requirement to stdout; display metadata goes to stderr.
          codesign -d -r- release-dist/macos/Tovi.app > "$RUNNER_TEMP/requirement.txt" 2>/dev/null
          grep -F 'certificate leaf = H' "$RUNNER_TEMP/requirement.txt"
          grep -F 'identifier "com.relationshipinboxos.desktop"' "$RUNNER_TEMP/requirement.txt"
          SHIPIT="release-dist/macos/Tovi.app/Contents/Frameworks/Squirrel.framework/Versions/A/Resources/ShipIt"
          codesign -d --entitlements :- "$SHIPIT" > "$RUNNER_TEMP/shipit-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' "$RUNNER_TEMP/shipit-entitlements.plist")" = "true"
          APP_ENTITLEMENTS="$RUNNER_TEMP/app-entitlements.plist"
          RENDERER_ENTITLEMENTS="$RUNNER_TEMP/renderer-entitlements.plist"
          codesign -d --entitlements :- release-dist/macos/Tovi.app > "$APP_ENTITLEMENTS" 2>/dev/null
          codesign -d --entitlements :- "release-dist/macos/Tovi.app/Contents/Frameworks/Electron Helper (Renderer).app" > "$RENDERER_ENTITLEMENTS" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$APP_ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RENDERER_ENTITLEMENTS")" = "true"

          mv release-dist/macos/Tovi-*-mac.zip "release-dist/macos/$ZIP_NAME"
          mv release-dist/macos/Tovi-*.dmg "release-dist/macos/$DMG_NAME"
          mv release-dist/macos/latest-macos.json "release-dist/macos/$FEED_NAME"

      - name: Smoke test signed clean first launch
        run: |
          APP="release-dist/macos/Tovi.app"
          APP_SUPPORT="$HOME/Library/Application Support/Relationship Inbox OS"
          DATABASE_PATH="$APP_SUPPORT/data/inbox-os.sqlite"
          LOG_PATH="$RUNNER_TEMP/tovi-clean-first-launch.log"
          test ! -e "$APP_SUPPORT"
          ! lsof -nP -iTCP:3100 -sTCP:LISTEN
          ! lsof -nP -iTCP:4001 -sTCP:LISTEN

          export DASHBOARD_PORT=3100
          export RUNNER_PORT=4001
          export LINKEDIN_ENABLED=false
          export LINKEDIN_AUTO_LOGIN=false
          export INSTAGRAM_ENABLED=false
          export IMESSAGE_ENABLED=false
          export WHATSAPP_ENABLED=false
          export GOOGLE_MESSAGES_ENABLED=false
          export CONTACTS_BIRTHDAY_SYNC=false
          export AUDIO_TRANSCRIPTION_ENABLED=false
          export ENRICH_AUTO_ENABLED=false
          export BROWSER_PROFILE_MODE=isolated
          export RIOS_UPDATE_FEED_URL=

          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
              osascript -e 'tell application id "com.relationshipinboxos.desktop" to quit' >/dev/null 2>&1 || true
              sleep 2
            fi
            if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
              kill -TERM "$APP_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          "$APP/Contents/MacOS/Tovi" >"$LOG_PATH" 2>&1 &
          APP_PID=$!
          READY=false
          for attempt in {1..180}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$LOG_PATH"
              echo "::error::Signed Tovi exited before clean first launch became ready"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:4001/health >"$RUNNER_TEMP/tovi-health.json" \
              && curl -fsS http://127.0.0.1:3100/today >"$RUNNER_TEMP/tovi-today.html"; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            cat "$LOG_PATH"
            echo "::error::Signed Tovi did not become healthy from a clean Application Support directory"
            exit 1
          fi

          test -s "$DATABASE_PATH"
          HEALTH_JSON="$(cat "$RUNNER_TEMP/tovi-health.json")" node -e '
            const health = JSON.parse(process.env.HEALTH_JSON);
            if (!Array.isArray(health.availablePlatforms) || health.availablePlatforms.length !== 0) {
              throw new Error(`real adapters were available during clean launch: ${JSON.stringify(health.availablePlatforms)}`);
            }
          '
          SETTINGS_JSON="$(curl -fsS http://127.0.0.1:4001/data/settings)" node -e '
            const settings = JSON.parse(process.env.SETTINGS_JSON);
            if (!Array.isArray(settings.enabledPlatforms) || settings.enabledPlatforms.length !== 0) {
              throw new Error(`clean launch enabled platforms: ${JSON.stringify(settings.enabledPlatforms)}`);
            }
          '

          osascript -e 'tell application id "com.relationshipinboxos.desktop" to quit'
          for attempt in {1..30}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            cat "$LOG_PATH"
            echo "::error::Signed Tovi did not quit cleanly"
            exit 1
          fi
          wait "$APP_PID"
          APP_PID=""
          ! lsof -nP -iTCP:3100 -sTCP:LISTEN
          ! lsof -nP -iTCP:4001 -sTCP:LISTEN

      - name: Publish zip first and feed last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes "Self-signed macOS build. Initial installation requires one trust step."
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes "Self-signed macOS pilot build. Initial installation requires one trust step."
            fi
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "release-dist/macos/$ZIP_NAME" \
            "release-dist/macos/$DMG_NAME"
          gh release upload "$RELEASE_TAG" --clobber "release-dist/macos/$FEED_NAME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-signed-macos-${{ env.RELEASE_TRACK }}
          path: |
            release-dist/macos/*.dmg
            release-dist/macos/*.zip
            release-dist/macos/*.json
          if-no-files-found: warn
          retention-days: 14
