# Builds, publishes, and verifies a student release to Dropbox in one manual
# run. Deliberately workflow_dispatch ONLY — publishing to pilots is a
# deliberate "yes, ship this" action, never automatic on push.
#
# Required GitHub Actions secrets (Settings > Secrets and variables > Actions):
#   Dropbox auth (refresh-token / offline flow — access tokens are short-lived):
#     DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN
#   Dropbox file paths that get OVERWRITTEN in place (keeps the share links stable):
#     RIOS_DROPBOX_ZIP_PATH, RIOS_DROPBOX_MANIFEST_PATH
#   Stable public share links (created once; reused every release):
#     RIOS_DROPBOX_ZIP_URL, RIOS_UPDATE_FEED_URL
# See docs/pilot/automated-release-publishing.md.
name: Publish Student Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes, one per line (optional)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1/strip-back-pr1
          fetch-depth: 0

      - name: Check required secrets are set
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          RIOS_DROPBOX_ZIP_PATH: ${{ secrets.RIOS_DROPBOX_ZIP_PATH }}
          RIOS_DROPBOX_MANIFEST_PATH: ${{ secrets.RIOS_DROPBOX_MANIFEST_PATH }}
          RIOS_DROPBOX_ZIP_URL: ${{ secrets.RIOS_DROPBOX_ZIP_URL }}
          RIOS_UPDATE_FEED_URL: ${{ secrets.RIOS_UPDATE_FEED_URL }}
        run: |
          missing=0
          for v in DROPBOX_APP_KEY DROPBOX_APP_SECRET DROPBOX_REFRESH_TOKEN \
                   RIOS_DROPBOX_ZIP_PATH RIOS_DROPBOX_MANIFEST_PATH \
                   RIOS_DROPBOX_ZIP_URL RIOS_UPDATE_FEED_URL; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Set the secrets above before publishing."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/core/prisma/schema.prisma

      - name: Release-safety checks (typecheck + full suite)
        run: |
          npm run lint
          npm run test:all

      - name: Build, publish to Dropbox, and verify the live feed
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          RIOS_DROPBOX_ZIP_PATH: ${{ secrets.RIOS_DROPBOX_ZIP_PATH }}
          RIOS_DROPBOX_MANIFEST_PATH: ${{ secrets.RIOS_DROPBOX_MANIFEST_PATH }}
          RIOS_DROPBOX_ZIP_URL: ${{ secrets.RIOS_DROPBOX_ZIP_URL }}
          RIOS_UPDATE_FEED_URL: ${{ secrets.RIOS_UPDATE_FEED_URL }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          ARGS=()
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.txt"
            ARGS+=(--notes-file "$RUNNER_TEMP/notes.txt")
          fi
          node scripts/publish-student-release.mjs "${ARGS[@]}"

      - name: Upload release artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-release
          path: |
            release-dist/relationship-inbox-os-student-*.zip
            release-dist/latest.json
            release-dist/*.sha256
          if-no-files-found: warn
          retention-days: 30
