name: Pilot feedback
description: Tell us how testing Relationship Inbox OS went.
title: "Pilot feedback: "
labels: ["pilot", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Relationship Inbox OS.

        Honest reactions help far more than polite ones. **Please do not paste
        private message content** — just your own words. Share only what
        you are comfortable sharing.
  - type: textarea
    id: details
    attributes:
      label: Your feedback
      description: >
        If you opened this from the app it has filled in a short set of
        questions — answer the ones you have a view on. Skip anything that
        does not apply.
      placeholder: |
        Did this help you reply?

        What felt wrong or annoying?

        Did the action items miss anything important?

        Did anything feel too AI?

        What would make this genuinely useful?
    validations:
      required: true
  - type: dropdown
    id: again
    attributes:
      label: Would you use this again tomorrow?
      options:
        - "Yes"
        - Maybe
        - "No"
    validations:
      required: true
