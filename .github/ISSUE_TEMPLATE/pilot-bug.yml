name: Pilot bug report
description: Something in Relationship Inbox OS broke or behaved oddly.
title: "Pilot bug: "
labels: ["pilot", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Relationship Inbox OS.

        **Please do not paste private message content.** The app fills the
        "App context" box below with safe details only (page, version, time).
        Describe what happened in your own words — no need to be polite.
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: >
        What were you trying to do, what went wrong, and what did you expect
        to happen? If you opened this from the app, it has filled in some
        context for you — leave that and add your description above it.
      placeholder: |
        What were you trying to do?

        What went wrong?

        What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: browser-mode
    attributes:
      label: Browser mode
      description: From your .env file (BROWSER_PROFILE_MODE).
      options:
        - personal
        - isolated
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: ai-help
    attributes:
      label: AI help level
      description: From Settings - Your reply style - AI help level.
      options:
        - Memory only
        - Writing support
        - Full drafts
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your computer
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: This report contains no private message content.
          required: true
